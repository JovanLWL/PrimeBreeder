<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Prime Breeder — your dogs, litters, health records and kennel planning in one connected application.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Prime Breeder">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Prime Breeder</title>
  <link rel="manifest" href="manifest.json">
  <!-- Start the exact FlutterFire SDK requests while the Flutter engine loads. -->
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      if (params.get('pbPerf') === '1' && params.get('pbSdkPreload') === '0') return;
      for (const href of [
        "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js",
        "https://www.gstatic.com/firebasejs/11.9.1/firebase-app-check.js",
        "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js",
        "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js",
        "https://www.gstatic.com/firebasejs/11.9.1/firebase-messaging.js",
        "https://www.gstatic.com/firebasejs/11.9.1/firebase-storage.js"
]) {
        const link = document.createElement('link');
        if (!link.relList.supports('modulepreload')) break;
        link.rel = 'modulepreload';
        link.crossOrigin = 'anonymous';
        link.href = href;
        document.head.append(link);
      }
    })();
  </script>
  <!-- Prime Breeder web release: v11-dog-icon-coi-four-b889ddc9cb07 -->
</head>
<body>

</body>
